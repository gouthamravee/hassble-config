devices:
- id: "parking_beacon"
  name: "Parking Beacon"
  source: "advertisement"
  match:
    manufacturer_id: 861
    manufacturer_hex_prefix: "04"
  instance_mode: "shared"
  sensors:
  - key: "parking_time"
    device_class: "timestamp"
    icon: "mdi:clock-time-four-outline"
    source_field: "manufacturer_data"
    length: 14
    decode:
      offset: 7
      length: 4
      type: "timestamp"
  - key: "parking_floor"
    icon: "mdi:layers-outline"
    accuracy_decimals: 0
    source_field: "manufacturer_data"
    length: 14
    decode:
      offset: 11
      scale: -1.0
      offset_value: 256.0
  - key: "parking_location"
    platform: "text_sensor"
    icon: "mdi:map-marker-outline"
    source_field: "manufacturer_data"
    length: 14
    decode:
      offset: 12
      length: 2
      type: "string"
- id: "apt_key_door"
  name: "APT Door Event"
  source: "advertisement"
  match:
    manufacturer_id: 861
    manufacturer_hex_prefix: "02"
  instance_mode: "shared"
  sensors:
  - key: "door_status"
    platform: "text_sensor"
    icon: "mdi:door"
    source_field: "manufacturer_data"
    length: 6
    decode:
      offset: 4
      map:
        "65": "entering"
        "1": "entering"
        "64": "exiting"
        "0": "idle"
    publish:
      min_interval: "1s"
- id: "car_obd"
  name: "Vehicle OBD"
  source: "obd"
  obd:
    service_uuid: "18F0"
    tx_char_uuid: "2AF1"
    rx_char_uuid: "2AF0"
    init_commands:
    - "ATSP6"
  sensors:
  - key: "battery"
    device_class: "voltage"
    unit: "V"
    state_class: "measurement"
    accuracy_decimals: 2
    preset: "battery_voltage"
    pid: "42"
    formula: "(a*256+b)/1000"
    update_interval: "10s"
  - key: "run_time"
    device_class: "duration"
    unit: "s"
    state_class: "total_increasing"
    accuracy_decimals: 0
    preset: "run_time"
    pid: "1F"
    formula: "a*256+b"
    update_interval: "5s"
  - key: "odometer"
    device_class: "distance"
    unit: "km"
    state_class: "total_increasing"
    accuracy_decimals: 1
    preset: "odometer"
    pid: "A6"
    formula: "(a*16777216+b*65536+c*256+d)/10"
    update_interval: "30s"
  - key: "fuel_level"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:gas-station"
    accuracy_decimals: 1
    preset: "fuel_level"
    pid: "2F"
    formula: "a/2.55"
    update_interval: "30s"
    publish:
      min_interval: "60s"
      deadband: 0.5
- id: "obd_vehicle"
  name: "OBD Vehicle"
  source: "obd"
  obd: {}
  sensors:
  - key: "rpm"
    unit: "rpm"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    preset: "rpm"
    pid: "0C"
    formula: "(a*256+b)/4"
    update_interval: "1s"
  - key: "speed"
    device_class: "speed"
    unit: "km/h"
    state_class: "measurement"
    icon: "mdi:speedometer"
    accuracy_decimals: 0
    preset: "speed"
    pid: "0D"
    formula: "a"
    update_interval: "1s"
  - key: "coolant_temp"
    device_class: "temperature"
    unit: "°C"
    state_class: "measurement"
    icon: "mdi:coolant-temperature"
    accuracy_decimals: 1
    preset: "coolant_temp"
    pid: "05"
    formula: "a-40"
    update_interval: "10s"
  - key: "fuel_level"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:gas-station"
    accuracy_decimals: 1
    preset: "fuel_level"
    pid: "2F"
    formula: "a/2.55"
    update_interval: "30s"
- id: "jaalee_jht"
  name: "Jaalee JHT"
  source: "advertisement"
  match:
    manufacturer_id: 76
    manufacturer_hex_prefix: "0215"
    manufacturer_min_length: 24
  sensors:
  - key: "temperature"
    device_class: "temperature"
    unit: "°C"
    state_class: "measurement"
    accuracy_decimals: 2
    source_field: "manufacturer_data"
    decode:
      offset: 18
      length: 2
      type: "uint16"
      scale: 0.002670288
      offset_value: -45.0
  - key: "humidity"
    device_class: "humidity"
    unit: "%"
    state_class: "measurement"
    accuracy_decimals: 2
    source_field: "manufacturer_data"
    decode:
      offset: 20
      length: 2
      type: "uint16"
      scale: 0.001524504
  - key: "battery"
    device_class: "battery"
    unit: "%"
    state_class: "measurement"
    source_field: "manufacturer_data"
    decode:
      offset: 23
- id: "veepeak"
  name: "VEEPEAK"
  source: "advertisement"
  match:
    mac: "8C:DE:52:DA:F9:2B"
    name_prefix: "VEEPEAK"
  sensors:
  - key: "value"
    state_class: "measurement"
    accuracy_decimals: 1
    min_length: 2
    decode:
      length: 2
      type: "int16"
      scale: 0.1
- id: "obd_vehicle_2"
  name: "obd_vehicle (2)"
  source: "obd"
  obd: {}
  sensors:
  - key: "actual_torque"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    preset: "actual_torque"
    pid: "62"
    formula: "a-125"
  - key: "battery_voltage"
    device_class: "voltage"
    unit: "V"
    state_class: "measurement"
    accuracy_decimals: 2
    preset: "battery_voltage"
    pid: "42"
    formula: "(a*256+b)/1000"
  - key: "coolant_temp"
    device_class: "temperature"
    unit: "°C"
    state_class: "measurement"
    icon: "mdi:coolant-temperature"
    accuracy_decimals: 1
    preset: "coolant_temp"
    pid: "05"
    formula: "a-40"
    update_interval: "10s"
  - key: "odometer"
    device_class: "distance"
    unit: "km"
    state_class: "total_increasing"
    accuracy_decimals: 1
    preset: "odometer"
    pid: "A6"
    formula: "(a*16777216+b*65536+c*256+d)/10"
    update_interval: "30s"
  - key: "rpm"
    unit: "rpm"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    preset: "rpm"
    pid: "0C"
    formula: "(a*256+b)/4"
    update_interval: "1s"
  - key: "run_time"
    device_class: "duration"
    unit: "s"
    state_class: "total_increasing"
    accuracy_decimals: 0
    preset: "run_time"
    pid: "1F"
    formula: "a*256+b"
  - key: "speed"
    device_class: "speed"
    unit: "km/h"
    state_class: "measurement"
    icon: "mdi:speedometer"
    accuracy_decimals: 0
    preset: "speed"
    pid: "0D"
    formula: "a"
    update_interval: "1s"
  - key: "throttle"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 1
    preset: "throttle"
    pid: "11"
    formula: "a/2.55"
    update_interval: "1s"